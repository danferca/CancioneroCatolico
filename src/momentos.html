<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momentos de la Eucaristía - Cancionero</title>
  <link rel="stylesheet" href="css/momentos.css">
</head>
<body>
  <div class="container">
    
    <!-- Encabezado de la página de momentos litúrgicos -->
    <header class="app-header">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <!-- Botón de navegación para regresar al índice general -->
        <a href="index.html" class="btn-back" style="text-decoration: none; display: inline-flex; align-items: center;">← Volver al Índice General</a>
      </div>
      <h1>⛪ Momentos Litúrgicos</h1>
      <p>Selecciona una parte de la Misa para ir a sus canciones</p>
    </header>

    <!-- Rejilla de tarjetas para cada momento de la Eucaristía -->
    <div class="momentos-menu-grid">
      
      <!-- Momento: Entrada -->
      <a href="index.html#momento-entrada" class="momento-card">
        <span class="momento-icon">🚪</span>
        <span class="momento-title">ENTRADA</span>
      </a>

      <!-- Momento: Piedad -->
      <a href="index.html#momento-piedad" class="momento-card">
        <span class="momento-icon">🙏</span>
        <span class="momento-title">PIEDAD / SEÑOR TEN PIEDAD</span>
      </a>

      <!-- Momento: Gloria -->
      <a href="index.html#momento-gloria" class="momento-card">
        <span class="momento-icon">✨</span>
        <span class="momento-title">GLORIA</span>
      </a>

      <!-- Momento: Aleluya / Aclamación -->
      <a href="index.html#momento-aleluia" class="momento-card">
        <span class="momento-icon">📖</span>
        <span class="momento-title">ALELUYA / ACLAMACIÓN</span>
      </a>

      <!-- Momento: Ofertorio / Presentación de dones -->
      <a href="index.html#momento-ofertorio" class="momento-card">
        <span class="momento-icon">🍞</span>
        <span class="momento-title">OFERTORIO / PRESENTACIÓN</span>
      </a>

      <!-- Momento: Santo -->
      <a href="index.html#momento-santo" class="momento-card">
        <span class="momento-icon">☁️</span>
        <span class="momento-title">SANTO</span>
      </a>

      <!-- Momento: Padre Nuestro -->
      <a href="index.html#momento-padrenuestro" class="momento-card">
        <span class="momento-icon">🕊️</span>
        <span class="momento-title">PADRE NUESTRO</span>
      </a>

      <!-- Momento: Paz y Cordero -->
      <a href="index.html#momento-paz" class="momento-card">
        <span class="momento-icon">🤝</span>
        <span class="momento-title">PAZ / CORDERO</span>
      </a>

      <!-- Momento: Comunión -->
      <a href="index.html#momento-comunion" class="momento-card">
        <span class="momento-icon">🍷</span>
        <span class="momento-title">COMUNIÓN</span>
      </a>

      <!-- Momento: Salida / Final -->
      <a href="index.html#momento-salida" class="momento-card">
        <span class="momento-icon">🚶</span>
        <span class="momento-title">SALIDA / FINAL</span>
      </a>

      <!-- Momento: Canciones a María -->
      <a href="index.html#momento-maria" class="momento-card">
        <span class="momento-icon">🌹</span>
        <span class="momento-title">CANCIONES A MARÍA</span>
      </a>

    </div>

  </div>
</body>
</html>
