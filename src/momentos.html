<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momentos de la Eucaristía - Cancionero</title>
  <link rel="stylesheet" href="css/momentos.css">
</head>
<body>
  <div class="container">
    
    <!-- Encabezado de la página de momentos litúrgicos -->
    <header class="app-header">
      <div style="margin-bottom: 16px;">
        <!-- Botón para regresar al índice general -->
        <a href="index.html" class="btn-back">← Volver al Índice General</a>
      </div>
      <h1>⛪ Momentos Litúrgicos</h1>
      <p>Selecciona una parte de la Misa para ir a sus canciones</p>
    </header>

    <!-- Contenedor donde se generarán dinámicamente las tarjetas de momentos principales -->
    <div id="momentosGrid" class="momentos-menu-grid">
      <!-- Generado por JavaScript desde songs.json -->
    </div>

  </div>

  <!-- Script para leer songs.json, extraer solo el primer momento y pintar los botones -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch("songs.json");
        if (!res.ok) throw new Error("No se pudo cargar songs.json");
        
        const songs = await res.json();
        const gridEl = document.getElementById("momentosGrid");
        gridEl.innerHTML = "";

        // Usar un Set para almacenar únicamente el momento principal de cada canción
        const momentosSet = new Set();
        songs.forEach(song => {
          if (song.momento) {
            // Toma exclusivamente la primera parte antes de la barra o coma (ej: "Entrada / Alabanza" -> "Entrada")
            let momentoPrincipal = song.momento.split(/[/,]/)[0].trim();
            if (momentoPrincipal) {
              momentosSet.add(momentoPrincipal);
            }
          }
        });

        // Jerarquía litúrgica para ordenar los botones de forma lógica
        const ordenMomentos = [
          "Entrada", "Piedad", "Gloria", "Salmo", "Aclamación", "Aleluya", 
          "Ofertorio", "Santo", "Paz", "Cordero", "Comunión", 
          "Salida", "Alabanza", "María", "Otros"
        ];

        // Ordenar los momentos según la jerarquía establecida
        const momentosOrdenados = Array.from(momentosSet).sort((a, b) => {
          let indexA = ordenMomentos.findIndex(m => a.toLowerCase().includes(m.toLowerCase()));
          let indexB = ordenMomentos.findIndex(m => b.toLowerCase().includes(m.toLowerCase()));
          if (indexA === -1) indexA = 99;
          if (indexB === -1) indexB = 99;
          return indexA - indexB;
        });

        // Iconos sugeridos para cada momento litúrgico principal
        const iconos = {
          "Entrada": "🚪",
          "Piedad": "🙏",
          "Gloria": "✨",
          "Aleluya": "📖",
          "Aclamación": "📖",
          "Ofertorio": "🍞",
          "Santo": "☁️",
          "Paz": "🤝",
          "Cordero": "🕊️",
          "Comunión": "🍷",
          "Salida": "🚶",
          "Alabanza": "🎸",
          "María": "🌹"
        };

        // Pintar cada tarjeta de momento en la rejilla
        momentosOrdenados.forEach(momento => {
          const idSeccion = 'momento-' + momento.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '-');
          const icono = iconos[momento] || "📌";

          const card = document.createElement("a");
          card.href = `index.html#${idSeccion}`;
          card.className = "momento-card";
          
          card.innerHTML = `
            <span class="momento-icon">${icono}</span>
            <span class="momento-title">${momento.toUpperCase()}</span>
          `;

          gridEl.appendChild(card);
        });

      } catch (e) {
        console.error("Error cargando los momentos:", e);
        document.getElementById("momentosGrid").innerHTML = "<p>Error al cargar los momentos litúrgicos.</p>";
      }
    });
  </script>
</body>
</html>
