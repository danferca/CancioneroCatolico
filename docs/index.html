<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancionero Virtual</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    
    
    <div id="indexView" class="view">
      <header class="app-header">
        <h1>🎵 Índice de Canciones ChordPro</h1>
        <p>Cancionero para Eucaristías y Tiempos Litúrgicos</p>
      </header>
      
      <div style="margin-bottom: 16px;">
        <a href="momentos.html" class="btn-back" style="text-decoration: none; display: inline-flex; align-items: center;">
          ⛪ Ver Momentos de la Misa
        </a>
      </div>
      <div class="search-container">
        <input type="text" id="searchBox" placeholder="🔍 Buscar por título, autor o momento litúrgico..." oninput="filtrarCanciones()">
      </div>
      <div id="songGrid" class="song-grid">
        
      </div>
    </div>
    
    
    <div id="songView" class="view hidden">
      <div class="top-nav">
        <button class="btn-back" onclick="mostrarIndice()">← Volver al Índice</button>
        
        
        <div class="instrument-selector">
          <strong>Instrumento:</strong>
          <select id="instrumentSelect" onchange="cambiarInstrumento(this.value)" inputmode="none">
            <option value="guitar">Guitarra</option>
            <option value="ukulele">Ukelele</option>
          </select>
        </div>
        <div class="transpose-controls">
          <button onclick="cambiarTono(-1)">-</button>
            <span id="transposeVal">0</span>
          <button onclick="cambiarTono(1)">+</button>
          <button class="btn-reset" onclick="resetTono()">Original</button>
        </div>
      </div>
      <div id="songContent" class="song-card">
        
      </div>
    </div>
  </div>
  <script src="js/chords-db.js"></script>
  <script src="js/config.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/footer-chords.js"></script>  
  
</body>
</html>
